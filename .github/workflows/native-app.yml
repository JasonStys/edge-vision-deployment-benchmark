# File: native-app.yml
# Purpose: Build the real scientific/native workbench and exercise its complete relocated Windows app.
name: Native application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_package:
        description: Retain the full unsigned package for explicit trusted-main owner review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Actual five-engine Windows workbench
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the current patched native Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.10
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-native.lock
      - name: Install exact scientific and freezer dependencies
        run: |
          python -m pip install -r requirements-native.lock
          python -m pip install --no-build-isolation --no-deps .
          rustup toolchain install 1.98.1 --profile minimal
      - name: Verify actual profile, widget, model and archive boundaries
        run: python -m pytest --basetemp=.runtime/windows-tests
      - name: Audit the exact Windows dependency graph
        run: python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off --requirement requirements-native.lock
      - name: Build and test the original C++ and Rust inference engines
        run: pwsh -NoProfile -File scripts/build-kernels.ps1 -Output .runtime/windows-kernels
      - name: Build a fresh source-bound native application
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Licensed Visual Studio source is required.' }
          $version = Get-ChildItem -LiteralPath (Join-Path $vs 'VC/Redist/MSVC') -Directory |
            Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [Version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem -LiteralPath (Join-Path $version.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'Signed x64 app-local runtime source unavailable.' }
          python scripts/build-native.py --output release/windows --kernels .runtime/windows-kernels/kernels --crt-sdk $crt.FullName
      - name: Relocate the full archive and use the real native application twice
        run: python scripts/archive_native.py release/windows/EdgeVisionWorkbench artifacts/native/windows
      - name: Retain bounded actual receipts and owned-window screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-edge-acceptance
          path: |
            artifacts/native/windows/summary.json
            artifacts/native/windows/first/acceptance.json
            artifacts/native/windows/first/*.png
            artifacts/native/windows/reopen/acceptance.json
            artifacts/native/windows/startup-failure.json
          retention-days: 1
          if-no-files-found: warn
      - name: Retain complete unsigned package only after explicit trusted-main opt-in
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EdgeVisionWorkbench-1.1.0-windows-x64
          path: |
            release/windows/EdgeVisionWorkbench-1.1.0-windows-x64.zip
            release/windows/EdgeVisionWorkbench-1.1.0-windows-x64.zip.sha256
          retention-days: 1
          if-no-files-found: error
