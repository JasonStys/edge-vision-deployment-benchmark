# File: Runs Python, native, cross-runtime, repository, dependency, and container quality gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python training, export, and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check formatting, lint, and strict types
        run: |
          python -m ruff format --check src tests scripts/compare-native.py
          python -m ruff check src tests scripts/compare-native.py
          python -m mypy
      - name: Run unit and integration tests with coverage
        run: python -m pytest
      - name: Audit the locked Python environment
        run: |
          python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off --requirement requirements.lock
          python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off --requirement requirements-runtime.lock
      - name: Validate checked deployment artifacts
        run: python -m edgevision validate --root .
      - name: Repeat benchmark with current runner evidence
        run: python -m edgevision benchmark --root . --report .runtime/ci-benchmark.json
      - name: Upload Python evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-evidence
          path: |
            coverage.xml
            .runtime/ci-benchmark.json
            docs/reports/generated/metrics.json
            docs/reports/generated/validation.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: C++ and Rust agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked comparison runtime
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Configure C++ with sanitizers
        run: >-
          cmake -S native/cpp -B .runtime/cpp
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEDGEVISION_SANITIZERS=ON
      - name: Build and test C++
        run: |
          cmake --build .runtime/cpp --parallel 2
          ctest --test-dir .runtime/cpp --output-on-failure
      - name: Check Rust formatting and lint
        run: |
          rustup show
          cargo fmt --manifest-path native/rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path native/rust/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and build Rust
        run: |
          cargo test --manifest-path native/rust/Cargo.toml --locked
          cargo build --manifest-path native/rust/Cargo.toml --release --locked
      - name: Run native inference
        run: |
          .runtime/cpp/edgevision_cpp artifacts/model/compact-mlp.evm artifacts/test-vectors.csv .runtime/cpp.csv
          native/rust/target/release/edgevision-rust artifacts/model/compact-mlp.evm artifacts/test-vectors.csv .runtime/rust.csv
      - name: Enforce cross-runtime agreement
        run: >-
          python scripts/compare-native.py
          --reference artifacts/reference-predictions.csv
          --candidate .runtime/cpp.csv
          --candidate .runtime/rust.csv
          --report .runtime/native-agreement.json
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-agreement
          path: |
            .runtime/native-agreement.json
            .runtime/cpp.csv
            .runtime/rust.csv
          if-no-files-found: error
          retention-days: 14

  repository:
    name: Documentation and repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate docs, headers, hashes, action pins, and code index
        run: |
          npm run validate
          npm run code-index:check
      - name: Check Bash syntax
        run: bash -n scripts/verify.sh scripts/benchmark.sh

  rustsec:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Audit Cargo.lock
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native/rust

  container:
    name: Non-root container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [python, repository]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.0.0
      - name: Build validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.0.0
        with:
          context: .
          push: false
          tags: edge-vision-deployment-benchmark:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
